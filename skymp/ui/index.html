<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>SkyMP Heavy RP - UI</title>
  <link rel="stylesheet" href="player-panel.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
      background: transparent;
      color: white;
    }

    /* === HUD DE VOZ ===
       ─── O que saiu daqui, e por quê ──────────────────────────────────────
       Até a Etapa 2 havia uma lista `#voip-hud`, canto inferior esquerdo, com
       um cartão e uma barra de volume POR pessoa em alcance. Numa taverna com
       oito pessoas isso eram oito cartões animados por cima do jogo, contando
       ao jogador uma coisa que ele não decide nada com: o ganho aplicado à voz
       de cada vizinho.

       A instrução da Etapa 3 foi específica sobre o que o HUD deve mostrar —
       MIC, WHISPER, NORMAL, SHOUT, MUTED, VOICE ERROR — e todos os seis são
       sobre a SUA voz. Sobrou um chip só.

       O que se perdeu junto: saber quem está falando pela barrinha. Isso passou
       a ser dito onde já se olha — o personagem, pela animação de fala
       (`core/voice/voice-speech-animation.js`). Um indicador de fala pertence à
       cena, não a uma lista no canto. */
    #voip-chip {
      position: fixed;
      bottom: 22px;
      left: 22px;
      display: none;
      align-items: center;
      gap: 7px;
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 3px 11px 3px 8px;
      font-size: 11px;
      letter-spacing: 0.6px;
      color: rgba(232,224,207,0.85);
      z-index: 100;
      pointer-events: none;
      /* Sem sombra, sem borda grossa, sem animação por padrão: um HUD de voz
         bem-comportado é o que a pessoa esquece que está lá. Só o estado de
         transmissão pulsa, porque é o único que ela precisa notar sem procurar. */
    }
    #voip-chip.visivel { display: flex; }
    #voip-chip .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: rgba(255,255,255,0.35);
      flex: none;
    }
    #voip-chip.transmitindo .dot { background: #7fc47f; animation: pulse 1.2s infinite; }
    #voip-chip.mudo .dot { background: #c76a6a; }
    #voip-chip.erro .dot { background: #c76a6a; }
    #voip-chip.erro { color: rgba(240,190,190,0.9); }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    /* === NAMETAG (POC) ===
       Ancorada no mundo, não na tela: `left`/`top` vêm de uma projeção
       mundo→tela feita no cliente e chegam em porcentagem da viewport
       (ver nametag-service.js). Todo o resto do HUD deste arquivo é
       `position: fixed` com canto fixo — esta é a primeira coisa aqui que
       segue um ator.

       `transition` de 60ms é o que cobre o intervalo entre atualizações: o
       cliente escreve no máximo 20x/s, e sem a interpolação a etiqueta andaria
       aos saltos. Só `left`/`top` são interpolados — animar `opacity` junto
       faria o aparecer/sumir arrastar. */
    #nametag {
      position: fixed;
      display: none;
      transform: translate(-50%, -100%);
      transition: left 60ms linear, top 60ms linear;
      padding: 3px 10px;
      border-radius: 12px;
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(187,161,107,0.35);
      color: #e8e0cf;
      font-size: 13px;
      letter-spacing: 0.3px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
      white-space: nowrap;
      pointer-events: none;
      z-index: 90;   /* abaixo do HUD de voz (100) — etiqueta nunca cobre controle */
    }
    #nametag.visivel { display: block; }

    /* === STATUS CHIP === */
    #voip-status {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 4px 14px;
      font-size: 12px;
      display: none;
      gap: 6px;
      align-items: center;
    }
    #voip-status.visible { display: flex; }
    #voip-status .dot { width: 7px; height: 7px; border-radius: 50%; }
    #voip-status.ok .dot { background:#4caf50; }
    #voip-status.error .dot { background:#e53935; }
    /* Âmbar: estado parcial. Hoje só um caso — ouvindo pelo relay, sem
       microfone pra falar. Verde mentiria e vermelho também. */
    #voip-status.warn .dot { background:#fb8c00; }

    /* === TRADE OVERLAY === */
    #trade-overlay {
      display: none;
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 560px;
      background: rgba(12,12,15,0.93);
      border: 1px solid #bba16b;
      border-radius: 10px;
      padding: 24px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.8);
    }
    #trade-overlay.open { display: block; }
    .trade-title {
      text-align: center;
      font-size: 18px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #bba16b;
      border-bottom: 1px solid rgba(187,161,107,0.3);
      padding-bottom: 12px;
      margin-bottom: 18px;
    }
    .trade-btn {
      background: #bba16b; color: #000;
      border: none; border-radius: 6px;
      padding: 8px 20px; cursor: pointer;
      font-weight: bold; font-size: 13px;
      margin-top: 14px;
    }
    .trade-btn:hover { background: #d4b97e; }

    /* === INTERACTION MENU / GOVERNANCE === */
    #interaction-menu {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, rgba(0,0,0,0.08), rgba(0,0,0,0.42));
      z-index: 220;
    }
    #interaction-menu.open { display: flex; }
    .interaction-shell {
      width: min(720px, calc(100vw - 40px));
      max-height: calc(100vh - 64px);
      display: grid;
      grid-template-columns: 1fr 1.3fr;
      gap: 14px;
      color: #f5f1e8;
    }
    .interaction-panel,
    .interaction-detail {
      background: rgba(10, 10, 13, 0.92);
      border: 1px solid rgba(187, 161, 107, 0.65);
      border-radius: 8px;
      box-shadow: 0 16px 50px rgba(0,0,0,0.72);
      overflow: hidden;
    }
    .interaction-head {
      padding: 14px 16px 12px;
      border-bottom: 1px solid rgba(187, 161, 107, 0.28);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .interaction-title {
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 1.6px;
      color: #d8bf82;
      line-height: 1.2;
    }
    .interaction-target {
      font-size: 12px;
      color: rgba(245,241,232,0.66);
      margin-top: 4px;
    }
    .interaction-close {
      width: 30px;
      height: 30px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.04);
      color: #f5f1e8;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
    }
    .interaction-body {
      padding: 12px;
      overflow: auto;
      max-height: calc(100vh - 170px);
    }
    .interaction-section + .interaction-section { margin-top: 14px; }
    .interaction-section-title {
      margin: 0 2px 8px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.3px;
      color: rgba(216,191,130,0.8);
    }
    .interaction-actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }
    .interaction-action {
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 0 12px;
      border: 1px solid rgba(128,128,128,0.46);
      border-radius: 6px;
      background: rgba(0,0,0,0.62);
      color: #fff;
      cursor: pointer;
      font-size: 14px;
      text-align: left;
    }
    .interaction-action:hover,
    .interaction-action.active {
      background: rgba(128,128,128,0.34);
      border-color: rgba(216,191,130,0.75);
    }
    .interaction-action[disabled] {
      opacity: 0.48;
      cursor: default;
    }
    .interaction-action .hint {
      color: rgba(245,241,232,0.45);
      font-size: 12px;
    }
    .interaction-detail {
      min-height: 360px;
    }
    .detail-empty {
      height: 100%;
      min-height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: rgba(245,241,232,0.58);
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }
    .detail-form {
      display: none;
      padding: 14px;
    }
    .detail-form.active { display: block; }
    .detail-form h3 {
      margin-bottom: 6px;
      color: #d8bf82;
      font-size: 16px;
      font-weight: 600;
    }
    .detail-form p {
      margin-bottom: 14px;
      color: rgba(245,241,232,0.62);
      font-size: 13px;
      line-height: 1.45;
    }
    .form-grid {
      display: grid;
      gap: 10px;
    }
    .form-row {
      display: grid;
      gap: 6px;
    }
    .form-row label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(216,191,130,0.82);
    }
    .form-row input,
    .form-row select,
    .form-row textarea {
      width: 100%;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 6px;
      background: rgba(0,0,0,0.55);
      color: #f5f1e8;
      padding: 10px 11px;
      font-size: 14px;
      outline: none;
      resize: vertical;
    }
    .form-row textarea { min-height: 86px; }
    .form-row input:focus,
    .form-row select:focus,
    .form-row textarea:focus {
      border-color: rgba(216,191,130,0.85);
    }
    .detail-footer {
      margin-top: 14px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .detail-btn {
      min-width: 96px;
      min-height: 36px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.06);
      color: #f5f1e8;
      cursor: pointer;
      font-size: 13px;
    }
    .detail-btn.primary {
      background: #bba16b;
      color: #080808;
      border-color: #bba16b;
      font-weight: 700;
    }
    .detail-btn:hover { filter: brightness(1.08); }
    /* Log de chat/notificações — empilha linhas (mais recente embaixo) em vez de
       sobrescrever uma única linha. Ancorado embaixo com column-reverse: novas
       linhas viram o último filho do DOM, que column-reverse renderiza no fim
       visual (embaixo); o excesso é cortado no topo (linhas mais antigas) por
       overflow:hidden. Substitui o antigo toast de linha única, que apagava a
       mensagem anterior antes de dar tempo de ler quando 2+ pessoas falavam. */
    .chat-log {
      position: fixed;
      left: 24px;
      bottom: 34px;
      width: min(480px, calc(100vw - 48px));
      max-height: 34vh;
      display: flex;
      flex-direction: column-reverse;
      gap: 4px;
      overflow: hidden;
      pointer-events: none;
      z-index: 260;
    }
    .chat-line {
      padding: 6px 12px;
      border-radius: 7px;
      border: 1px solid rgba(187,161,107,0.4);
      background: rgba(10,10,13,0.88);
      color: #f5f1e8;
      font-size: 13px;
      line-height: 1.4;
      opacity: 1;
      transition: opacity 1.1s ease;
      word-wrap: break-word;
      white-space: pre-wrap;
    }
    .chat-line.fade { opacity: 0; }

    @media (max-width: 720px) {
      .interaction-shell {
        grid-template-columns: 1fr;
      }
      .interaction-detail {
        min-height: 280px;
      }
      .interaction-body {
        max-height: 38vh;
      }
    }
  </style>
</head>
<body>

<!-- Status VOIP -->
<div id="voip-status">
  <div class="dot"></div>
  <span id="voip-status-text">VOIP</span>
</div>

<!-- HUD de voz: um chip só, sobre a SUA voz. Ver o comentário no CSS. -->
<div id="voip-chip">
  <div class="dot"></div>
  <span id="voip-chip-text">NORMAL</span>
</div>

<!-- Nametag do personagem mais proximo (POC) -->
<div id="nametag"></div>

<!-- Trade Overlay -->
<div id="trade-overlay">
  <div class="trade-title">⚖ Comércio Seguro</div>
  <p style="text-align:center; color:#aaa; font-size:14px;">
    Interface de troca em desenvolvimento.<br>
    Use <strong>/tradeaccept</strong> para confirmar ou <strong>/tradecancel</strong> para recusar.
  </p>
  <div style="text-align:center">
    <button class="trade-btn" onclick="closeTrade()">Fechar</button>
  </div>
</div>

<!-- Interaction / Governance Menu -->
<div id="interaction-menu" aria-hidden="true">
  <div class="interaction-shell">
    <div class="interaction-panel">
      <div class="interaction-head">
        <div>
          <div class="interaction-title">Interagir</div>
          <div class="interaction-target" id="interaction-target">Sem alvo</div>
        </div>
        <button class="interaction-close" onclick="closeInteractionMenu()" aria-label="Fechar">×</button>
      </div>
      <div class="interaction-body" id="interaction-actions"></div>
    </div>

    <div class="interaction-detail">
      <div id="interaction-detail-empty" class="detail-empty">Selecione uma acao para continuar.</div>
      <form id="interaction-action-form" class="detail-form" onsubmit="submitInteractionAction(event)">
        <h3 id="detail-title">Acao</h3>
        <p id="detail-description"></p>
        <div class="form-grid" id="detail-fields"></div>
        <div class="detail-footer">
          <button type="button" class="detail-btn" onclick="clearInteractionDetail()">Cancelar</button>
          <button type="submit" class="detail-btn primary">Confirmar</button>
        </div>
      </form>
    </div>
  </div>
</div>
<div id="chat-log" class="chat-log" aria-live="polite"></div>

<!-- Painel do Jogador -->
<div id="player-panel" aria-hidden="true">
  <div class="pp-head">
    <div class="pp-head-text">
      <div class="pp-eyebrow">Painel do Jogador</div>
      <div class="pp-title" id="pp-char-name">—</div>
    </div>
    <div class="pp-status-chip" id="pp-status-chip">
      <span class="pp-status-dot"></span><span id="pp-status-text">Em ordem</span>
    </div>
    <button id="pp-close" class="pp-close" aria-label="Fechar">×</button>
  </div>
  <div class="pp-tabs">
    <button type="button" class="pp-tab active" data-tab="status">
      <span class="pp-rune">ᛊ</span>Status
    </button>
    <button type="button" class="pp-tab" data-tab="governance">
      <span class="pp-rune">ᛟ</span>Lei
    </button>
    <button type="button" class="pp-tab" data-tab="economy">
      <span class="pp-rune">ᚠ</span>Bens
    </button>
    <button type="button" class="pp-tab" data-tab="social">
      <span class="pp-rune">ᛗ</span>Social
    </button>
  </div>
  <div class="pp-body">
    <div id="pp-section-status" class="pp-section active"></div>
    <div id="pp-section-governance" class="pp-section"></div>
    <div id="pp-section-economy" class="pp-section"></div>
    <div id="pp-section-social" class="pp-section"></div>
  </div>
</div>

<script>
  // ── Mock mp para testes fora do SkyMP ─────────────────────────────────────
  if (typeof mp === 'undefined') {
    window.mp = {
      trigger: (ev, data) => console.log('[mock] trigger:', ev, data),
      events: { add: (ev, cb) => console.log('[mock] event registered:', ev) }
    };
  }

  // ── Estado Local ──────────────────────────────────────────────────────────
  const state = {
    actorId: null,
    muted: false,
    voiceMode: 'normal',       // normal | whisper | shout
    peers: new Map(),          // actorId -> { pc, gainNode, audioEl }
    ws: null,
    voiceFatal: false,         // motivo terminal já exibido — ver setStatus/onclose

    // Caminho novo (helper nativo): actorId -> cadeia de áudio espacial.
    // Mapa separado do `peers` de propósito — ali toda entrada tem um
    // RTCPeerConnection e `removePeer` chama `pc.close()`. Uma fonte de relay não
    // tem `pc`, e enfiá-la no mesmo mapa transformaria cada uso de `peers` num
    // campo minado de `if (peer.pc)`.
    relayPeers: new Map(),
    relayHeard: false,         // já chegou algum audio_frame nesta sessão de voz

    audioCtx: null,
    localStream: null,

    // Parâmetros dos efeitos, recebidos UMA vez no `auth_ok`. O servidor é a
    // autoridade sobre eles (`server-options.voice.effects.*`); estes valores
    // só valem enquanto o handshake não chega.
    effectSettings: { muffled: { lowpassHz: 700 }, faint: { lowpassHz: 2400 } },

    // Estado da própria voz, para o chip. Nada aqui decide coisa alguma — o
    // servidor decide e manda; isto é a cópia que se desenha.
    transmitting: false,
    voiceError: null,

    // Contadores de custo, lidos por `window.voiceStats()`. Existem porque a
    // etapa pediu medição no cliente e ninguém mede o que não conta.
    audioStats: { chains: 0, panners: 0, filters: 0, framesPlayed: 0, framesDropped: 0, peakChains: 0 },
    interaction: {
      targetActorId: null,
      sections: [],
      selectedAction: null
    }
  };

  // ─── ACTION_CONFIG foi removido em 13/08/2026 ──────────────────────────────
  //
  // O cliente mantinha aqui a própria tabela de campos de cada ação: título,
  // descrição, tipo de input, mínimo, máximo, placeholder. O servidor mantinha
  // a dele, no `schema` de cada interação.
  //
  // Duas declarações da mesma coisa, e nenhuma autoridade sobre a outra. O dia
  // em que o servidor apertasse um limite — `amount` máximo, tamanho do motivo,
  // um campo novo obrigatório — esta tabela continuaria oferecendo o antigo, e
  // o jogador descobriria digitando e sendo recusado.
  //
  // Agora os campos vêm do servidor, em `action.fields`, montados por
  // `describeFields` no `core/interaction-service.js`. Ver
  // `docs/framework/INTERACTION_FRAMEWORK.md` §11.

  function normalizePayload(data) {
    if (!data) return {};
    if (typeof data === 'string') {
      try { return JSON.parse(data); } catch { return {}; }
    }
    return data;
  }

  function formatActorId(actorId) {
    if (typeof actorId === 'number') return `0x${actorId.toString(16)}`;
    const raw = String(actorId || '');
    return raw.startsWith('0x') ? raw : `0x${raw}`;
  }

  function sendUiEvent(type, data) {
    const payload = { type, data };
    if (!window.mp) return;

    if (typeof window.mp.send === 'function') {
      window.mp.send(type, JSON.stringify(data || {}));
    }
    if (typeof window.mp.trigger === 'function') {
      window.mp.trigger(type, data || {});
      window.mp.trigger('cef::ui:event', payload);
    }
  }

  // `sendChatCommand` foi removida em 13/08/2026. Ela existia para o
  // `submitType: 'chat'` do `ACTION_CONFIG`: três ações do menu não eram
  // eventos de UI, eram comandos de chat digitados pelo cliente
  // (`/trade`, `/groupinvite`, `/apresentar`). Duas nunca existiram no servidor
  // e a terceira virou a interação `identity.introduce`. Sem chamador, a função
  // era uma segunda porta de entrada para o chat esperando alguém usá-la.

  const CHAT_LOG_MAX_LINES = 40;
  const CHAT_LOG_FADE_AFTER_MS = 18000;
  const CHAT_LOG_REMOVE_AFTER_MS = 1200;

  function showInteractionToast(message) {
    const log = document.getElementById('chat-log');
    if (!log || !message) return;

    const line = document.createElement('div');
    line.className = 'chat-line';
    line.textContent = message;
    log.appendChild(line);

    while (log.children.length > CHAT_LOG_MAX_LINES) {
      log.removeChild(log.firstChild);
    }

    setTimeout(() => {
      line.classList.add('fade');
      setTimeout(() => line.remove(), CHAT_LOG_REMOVE_AFTER_MS);
    }, CHAT_LOG_FADE_AFTER_MS);
  }

  // ── WebSocket Signaling ───────────────────────────────────────────────────
  // Conecta ao voip-service com um ticket de uso único emitido pelo servidor
  // (comando /voz → property 'voipTicket' → window.handleVoipTicket abaixo).
  // O servidor informa host/porta porque este arquivo é estático — sem isso
  // só funcionaria com o jogador na mesma máquina do servidor.
  function connectVoip(actorId, ticket, host, port) {
    // `/voz` chamado duas vezes sem a primeira ter caído é o caminho mais curto
    // para ÁUDIO DUPLICADO: o socket antigo continua entregando quadros, o novo
    // começa a entregar os mesmos, e cada locutor passa a ter duas cadeias
    // tocando com jitter próprio — que soa como eco e não como bug. Fechar
    // antes de abrir é o que impede isso, e é responsabilidade do cliente
    // porque só ele sabe que o socket anterior é dele.
    if (state.ws) {
      const anterior = state.ws;
      state.ws = null;
      // O handler de close do socket antigo já não pode mexer no estado novo.
      anterior.onclose = null;
      anterior.onerror = null;
      anterior.onmessage = null;
      try { anterior.close(); } catch { /* já morto */ }
    }
    tearDownVoiceAudio();

    state.actorId = actorId;
    state.voiceFatal = false; // nova tentativa de /voz — o motivo anterior não vale mais
    state.voiceError = null;
    state.relayHeard = false; // idem: o chip volta a poder ser corrigido nesta sessão
    const wsUrl = `ws://${host || '127.0.0.1'}:${port || 7778}`;
    state.ws = new WebSocket(wsUrl);

    state.ws.onopen = () => {
      state.ws.send(JSON.stringify({ type: 'auth', actorId, ticket }));
    };

    state.ws.onmessage = async (e) => {
      const msg = JSON.parse(e.data);
      await handleSignal(msg);
    };

    state.ws.onerror = () => {
      state.voiceError = 'sinalização';
      renderVoiceChip();
      if (!state.voiceFatal) setStatus('error', 'VOZ INDISPONÍVEL');
    };

    // 'VOZ DESCONECTADA' descreve a consequência, não a causa. Quando a
    // sinalização é fechada *por nós* depois de um motivo terminal já exibido
    // (mic bloqueado pelo CEF, ticket recusado), o close chega no tick seguinte
    // e apagava a mensagem específica — o jogador acabava lendo "desconectada",
    // que parece instabilidade de servidor, exatamente o diagnóstico errado.
    state.ws.onclose = () => {
      // A sinalização caiu: nenhum quadro vai chegar, e nenhuma rota vai ser
      // atualizada. Manter as cadeias montadas significaria continuar
      // processando silêncio para todo mundo que estava perto no instante da
      // queda — e, na reconexão, montar um segundo conjunto por cima delas.
      // Áudio duplicado começa exatamente assim.
      tearDownVoiceAudio();
      esconderVoiceChip();
      if (!state.voiceFatal) setStatus('error', 'VOZ DESCONECTADA');
    };
  }

  async function handleSignal(msg) {
    switch (msg.type) {
      case 'auth_ok':
        // Os parâmetros dos efeitos chegam UMA vez, aqui. Eles vêm do
        // `server-options` do servidor, e o cliente não tem opinião sobre eles:
        // um passa-baixa que o jogador escolhesse seria a mordaça que ele
        // desliga sozinho.
        if (msg.effects && typeof msg.effects === 'object') {
          state.effectSettings = msg.effects;
        }
        state.voiceError = null;
        setStatus('ok', 'VOZ ATIVA');
        renderVoiceChip();
        await initMicrophone();
        break;

      case 'auth_failed':
        state.voiceFatal = true;
        state.voiceError = 'ticket recusado';
        setStatus('error', 'FALHA NA VOZ — tente /voz de novo');
        renderVoiceChip();
        if (state.ws) state.ws.close();
        break;

      case 'voice_mode':
        // O servidor confirma (ou recusa) o modo. O chip desenha o que o
        // servidor disse, nunca o que o cliente pediu — foi assim que `'radio'`
        // conseguiu, na Etapa 1, deixar alguém inaudível com a UI dizendo que
        // estava tudo bem.
        if (msg.ok) state.voiceMode = msg.mode;
        renderVoiceChip();
        break;

      case 'ptt':
        state.transmitting = msg.transmitting === true;
        renderVoiceChip();
        break;

      case 'voice_speaking':
        // Alguém em alcance começou/parou de falar. O cliente não decide isto —
        // o servidor decidiu, com `canSpeak` e com os quadros que chegaram.
        // Repassado ao gamemode para animação; a UI em si não desenha nada,
        // porque um indicador de fala pertence ao personagem, não a uma lista.
        if (typeof mp !== 'undefined' && typeof mp.trigger === 'function') {
          mp.trigger('cef::voice:speaking', { actorId: msg.actorId, speaking: msg.speaking === true });
        }
        break;

      case 'proximity_update':
        // Atualiza volume, efeito e DIREÇÃO de cada fonte em alcance.
        for (const p of msg.peers) {
          // Só abre WebRTC para quem já tem `pc` ou está começando: no caminho
          // do relay não há peer connection nenhuma, e é esse o caminho que
          // funciona hoje.
          if (!state.peers.has(p.actorId) && state.localStream) {
            await initiateCall(p.actorId);
          }
          const peer = state.peers.get(p.actorId);
          if (peer && peer.gainNode) {
            peer.gainNode.gain.setTargetAtTime(p.volume, state.audioCtx.currentTime, 0.1);
          }

          // A cadeia de relay só é TOCADA se já existir. Criá-la aqui montaria
          // ganho, panner e filtro para alguém de quem talvez nunca chegue um
          // quadro — que é exatamente o processamento de áudio inútil que a
          // etapa manda evitar. Quem cria é o primeiro quadro que chega.
          const chain = state.relayPeers.get(p.actorId);
          if (chain) {
            if (p.volume !== chain.volume) {
              chain.volume = p.volume;
              chain.gainNode.gain.setTargetAtTime(p.volume, state.audioCtx.currentTime, 0.1);
            }
            if (p.dir) setPannerDirection(chain, p.dir);
            applyEffect(chain, p.effect);
          }
        }
        // Remove peers que saíram do alcance
        for (const [id] of state.peers) {
          if (!msg.peers.find(p => p.actorId === id)) {
            removePeer(id);
          }
        }
        // Idem para as fontes de relay. Precisa de laço próprio: quem só é
        // ouvido pelo helper nunca entra em `state.peers`, então o laço acima
        // não o alcança e a cadeia de áudio dele ficaria pendurada pra sempre.
        for (const [id] of state.relayPeers) {
          if (!msg.peers.find(p => p.actorId === id)) {
            removeRelayPeer(id);
          }
        }
        break;

      case 'offer':
        await handleOffer(msg.fromActorId, msg.sdp);
        break;

      case 'answer':
        if (state.peers.has(msg.fromActorId)) {
          await state.peers.get(msg.fromActorId).pc.setRemoteDescription({ type: 'answer', sdp: msg.sdp });
        }
        break;

      case 'ice':
        if (state.peers.has(msg.fromActorId)) {
          await state.peers.get(msg.fromActorId).pc.addIceCandidate(msg.candidate);
        }
        break;

      case 'audio_frame':
        // Caminho novo: PCM cru vindo do helper nativo, já retransmitido pelo
        // servidor com o volume calculado para *este* ouvinte. Não há WebRTC
        // envolvido — só decodificar e tocar. Ver docs/technical/VOICE_NATIVE_HELPER.md.
        playRelayFrame(msg.fromActorId, msg.volume, msg.data, msg.effect);
        break;

      case 'peer_left':
        removePeer(msg.actorId);
        break;
    }
  }

  // ── Áudio retransmitido pelo servidor (helper nativo) ─────────────────────
  // Formato do fio, fixo na Fase 1 e igual ao declarado em voip-service.js:
  // PCM 16-bit little-endian, mono, 48kHz, quadros de 20ms.
  const RELAY_SAMPLE_RATE = 48000;

  // Jitter buffer: quanto agendar à frente do relógio do AudioContext. Menos que
  // isso e qualquer atraso de rede vira um buraco audível entre quadros de 20ms.
  const RELAY_JITTER_S = 0.06;

  // Teto de fila. Se os quadros chegarem mais rápido que o tempo real (rajada
  // depois de um congestionamento), `nextPlayTime` cresce sem limite e a latência
  // só aumenta — o jogador ouviria a fala de dez segundos atrás. Passando disso,
  // pula pro presente: numa conversa, atrasar é pior que perder um pedaço.
  const RELAY_MAX_QUEUE_S = 0.5;

  /**
   * AudioContext sob demanda, independente do microfone.
   *
   * Antes o contexto nascia dentro de `initMicrophone()`, o que era suficiente
   * quando a única fonte era o WebRTC. Agora tocar áudio recebido não depende
   * mais de conseguir capturar — e no client oficial a captura *não* funciona,
   * que é justamente o caso em que este caminho precisa funcionar.
   */
  function ensureAudioContext() {
    if (!state.audioCtx) {
      const Ctor = window.AudioContext || window.webkitAudioContext;
      state.audioCtx = new Ctor({ sampleRate: RELAY_SAMPLE_RATE });
    }
    // Navegador comum pode nascer 'suspended' até um gesto do usuário; no CEF em
    // jogo não há gesto nenhum, então pedir resume a cada quadro é barato e é a
    // diferença entre tocar e ficar mudo sem erro nenhum no console.
    if (state.audioCtx.state === 'suspended') state.audioCtx.resume().catch(() => {});
    return state.audioCtx;
  }

  // ── Pipeline de áudio espacial ────────────────────────────────────────────
  //
  //   BufferSource ─► GainNode ─► [BiquadFilter] ─► PannerNode ─► destination
  //                      │              │               │
  //                   volume         efeito         direção
  //                (do servidor)   (mordaça,      (unitário, no
  //                                 abatido)      referencial do
  //                                                  ouvinte)
  //
  // ─── Duas decisões que o desenho conceitual não fixa ───────────────────────
  //
  // **1. O filtro vem ANTES do panner, não depois.** A instrução desenhava
  // `Panner → Environment Filter → Destination`. Depois do panner o sinal é
  // estéreo, e o biquad passaria a filtrar dois canais em vez de um — o dobro
  // do custo, num navegador que é a parte mais apertada deste sistema. Com
  // `equalpower` o panner é um par de ganhos constantes, então filtrar antes ou
  // depois dá o MESMO resultado audível. Trocou-se ordem por metade da conta,
  // sem trocar o som.
  //
  // **2. O panner NÃO atenua por distância.** `rolloffFactor = 0` e
  // `refDistance = maxDistance = 1`, com a fonte sempre a raio 1. A queda por
  // distância é do servidor e já está no `volume`; deixar o panner aplicar a
  // dele produziria duas quedas independentes, uma autoritativa e uma não, e o
  // desvio cresceria com a distância — o disfarce perfeito para uma regra de
  // jogo quebrada. Ver `core/voice/voice-spatial.js`.
  //
  // ─── Compatibilidade com a CEF 108 (Chromium 108.0.5359) ──────────────────
  //
  // Tudo aqui existe desde o Chromium 52 ou antes: `createPanner`,
  // `createBiquadFilter`, `PannerNode.positionX` como `AudioParam`,
  // `panningModel = 'equalpower'`, `setTargetAtTime`. Deliberadamente FORA:
  // `AudioContext.setSinkId` (Chromium 110), `AudioWorklet` (existe na 108 mas
  // exige carregar módulo por URL, o que a origem `file://` deste arquivo
  // complica), `HRTF` (custo por fonte muito maior que `equalpower`, sem ganho
  // que se note em fone dentro de um jogo).
  //
  // `positionX` mesmo assim é detectado em runtime, com queda para o
  // `setPosition()` obsoleto: o pin da CEF pode mudar, e um `undefined.value`
  // aqui silenciaria a voz de todo mundo com um TypeError por quadro.

  /** `equalpower` e não `HRTF`: ver a nota de compatibilidade acima. */
  const PANNING_MODEL = 'equalpower';

  function getRelayChain(actorId) {
    let chain = state.relayPeers.get(actorId);
    if (chain) return chain;

    const ctx = ensureAudioContext();

    const gainNode = ctx.createGain();
    gainNode.gain.value = 0; // silencioso até o primeiro volume do servidor

    const panner = ctx.createPanner();
    panner.panningModel = PANNING_MODEL;
    panner.distanceModel = 'inverse';
    panner.refDistance = 1;
    panner.maxDistance = 1;
    panner.rolloffFactor = 0;   // ← a distância é do servidor. Ver acima.
    panner.coneInnerAngle = 360; // sem cone: a boca de um jogador não aponta
    panner.coneOuterAngle = 360; //   para lugar nenhum que este sistema saiba
    panner.connect(ctx.destination);

    chain = {
      gainNode,
      panner,
      filter: null,       // criado só quando um efeito exigir. Ver `applyEffect`.
      effect: 'none',
      nextPlayTime: 0,
      volume: null,
      dir: null,
      level: 0,           // RMS do último quadro — o `audioLevel` do cliente
      activeSources: 0
    };

    // Sem efeito, o ganho vai direto ao panner: um nó a menos por locutor.
    gainNode.connect(panner);
    setPannerDirection(chain, [0, 0, -1]);

    state.relayPeers.set(actorId, chain);
    state.audioStats.chains++;
    state.audioStats.panners++;
    if (state.audioStats.chains > state.audioStats.peakChains) {
      state.audioStats.peakChains = state.audioStats.chains;
    }
    return chain;
  }

  /**
   * Aponta a fonte. `dir` é unitário no referencial do ouvinte, vindo do
   * servidor: `+x` direita, `+y` cima, `-z` à frente.
   */
  function setPannerDirection(chain, dir) {
    if (!dir || dir.length < 3) return;
    const ctx = state.audioCtx;
    const panner = chain.panner;
    if (panner.positionX && typeof panner.positionX.setTargetAtTime === 'function') {
      // Rampa curta: teleportar a fonte de um lado ao outro produz um clique
      // audível. 40 ms é rápido o bastante para acompanhar quem gira em volta e
      // lento o bastante para não estalar.
      panner.positionX.setTargetAtTime(dir[0], ctx.currentTime, 0.04);
      panner.positionY.setTargetAtTime(dir[1], ctx.currentTime, 0.04);
      panner.positionZ.setTargetAtTime(dir[2], ctx.currentTime, 0.04);
    } else if (typeof panner.setPosition === 'function') {
      panner.setPosition(dir[0], dir[1], dir[2]);
    }
    chain.dir = dir;
  }

  /**
   * Liga ou desliga o filtro de ambiente desta fonte.
   *
   * O `BiquadFilterNode` **não existe** enquanto o efeito é `none`: um
   * passa-baixa em 20 kHz seria transparente ao ouvido e não seria transparente
   * à CPU, e a instrução da etapa foi explícita sobre não manter processamento
   * de áudio para quem não precisa dele. Numa cena de oito pessoas em que uma
   * está amordaçada, isso é um biquad, não oito.
   *
   * A religação acontece só quando o efeito MUDA, que é raro — amordaçar,
   * desmaiar, cair. O caso comum não paga nada.
   */
  function applyEffect(chain, effect) {
    const desired = effect || 'none';
    if (chain.effect === desired) return;

    const ctx = state.audioCtx;
    const settings = state.effectSettings[desired];

    if (!settings) {
      // Voltando para `none`: o filtro sai da cadeia e é descartado.
      if (chain.filter) {
        try { chain.gainNode.disconnect(); } catch { /* já solto */ }
        try { chain.filter.disconnect(); } catch { /* já solto */ }
        chain.filter = null;
        state.audioStats.filters--;
        chain.gainNode.connect(chain.panner);
      }
      chain.effect = 'none';
      return;
    }

    if (!chain.filter) {
      const filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      // Q no padrão (0.707, Butterworth): sem ressonância na frequência de
      // corte. Um Q alto faria a mordaça soar como um telefone com assobio,
      // que chama mais atenção do que a voz que ela deveria esconder.
      filter.Q.value = Math.SQRT1_2;
      try { chain.gainNode.disconnect(); } catch { /* já solto */ }
      chain.gainNode.connect(filter);
      filter.connect(chain.panner);
      chain.filter = filter;
      state.audioStats.filters++;
    }

    chain.filter.frequency.setTargetAtTime(settings.lowpassHz, ctx.currentTime, 0.05);
    chain.effect = desired;
  }

  /** base64 → Float32 mono. PCM 16-bit little-endian, como o helper envia. */
  function decodeRelayFrame(b64) {
    const bin = atob(b64);
    const samples = bin.length >> 1;
    const pcm = new Float32Array(samples);
    for (let i = 0; i < samples; i++) {
      const lo = bin.charCodeAt(i * 2);
      const hi = bin.charCodeAt(i * 2 + 1);
      const signed = ((hi << 8) | lo) << 16 >> 16; // estende o sinal de 16 bits
      pcm[i] = signed / 32768;
    }
    return pcm;
  }

  function playRelayFrame(fromActorId, volume, b64, effect) {
    if (typeof b64 !== 'string' || !b64.length) return;

    let pcm;
    try {
      pcm = decodeRelayFrame(b64);
    } catch (err) {
      state.audioStats.framesDropped++;
      console.error('[voip] audio_frame ilegível:', err);
      return;
    }
    if (!pcm.length) return;

    const ctx = ensureAudioContext();
    const chain = getRelayChain(fromActorId);

    // Só reprograma o ganho quando o volume muda de verdade. Chamar
    // setTargetAtTime 50x por segundo empilharia eventos na timeline do
    // AudioParam sem mudar nada.
    if (volume !== chain.volume) {
      chain.volume = volume;
      chain.gainNode.gain.setTargetAtTime(volume, ctx.currentTime, 0.1);
    }

    // O efeito vem no QUADRO e não só no `proximity_update`: uma mordaça
    // colocada entre dois ticks precisa valer no quadro seguinte, não daqui a
    // 150 ms. `applyEffect` sai na primeira linha quando nada mudou.
    applyEffect(chain, effect);

    // `audioLevel` do cliente: RMS do quadro que ele já decodificou. Um
    // `AnalyserNode` daria o mesmo número e custaria um nó e uma FFT por
    // locutor; esta é uma passada por 960 amostras que já estão em cache.
    // O SERVIDOR não tem este número — ele não abre o PCM, e é isso que
    // `voice-speaking-state.audioLevel()` devolve `null` para dizer.
    let soma = 0;
    for (let i = 0; i < pcm.length; i++) soma += pcm[i] * pcm[i];
    chain.level = Math.sqrt(soma / pcm.length);

    const buffer = ctx.createBuffer(1, pcm.length, RELAY_SAMPLE_RATE);
    buffer.getChannelData(0).set(pcm);
    const source = ctx.createBufferSource();
    source.buffer = buffer;
    source.connect(chain.gainNode);

    // Um `BufferSource` é descartável por contrato — não se pode chamar
    // `start()` duas vezes nele — e o navegador o coleta sozinho depois de
    // tocar. O `onended` existe para o CONTADOR, não para a limpeza: sem ele
    // `voiceStats()` não teria como mostrar que as fontes não estão se
    // acumulando, que é justamente o vazamento que este pipeline poderia ter.
    chain.activeSources++;
    source.onended = () => { chain.activeSources--; };

    const now = ctx.currentTime;
    if (chain.nextPlayTime < now || chain.nextPlayTime > now + RELAY_MAX_QUEUE_S) {
      chain.nextPlayTime = now + RELAY_JITTER_S;
    }
    source.start(chain.nextPlayTime);
    chain.nextPlayTime += buffer.duration;
    state.audioStats.framesPlayed++;

    // Corrige o chip na primeira vez que áudio realmente chega. Sem isto, quem
    // está no client oficial lê "VOZ INDISPONÍVEL" enquanto ouve outra pessoa
    // falando — o estado na tela contradizendo o que sai da caixa de som. O
    // motivo terminal continua valendo pra *falar*, e `voiceFatal` segue marcado
    // porque é ele que impede o onclose de sobrescrever a explicação.
    if (!state.relayHeard) {
      state.relayHeard = true;
      setStatus(state.voiceFatal ? 'warn' : 'ok',
        state.voiceFatal ? 'OUVINDO — SEM MICROFONE' : 'VOZ ATIVA');
    }
  }

  /**
   * Desmonta a cadeia de áudio de um locutor.
   *
   * **Todos** os nós saem, não só o ganho. Antes desta etapa a cadeia era um
   * `GainNode` só e desconectar ele bastava; agora são até três, e desconectar
   * apenas o primeiro deixaria o filtro e o panner pendurados no `destination`
   * — nós vivos, num grafo que o navegador continua percorrendo a cada bloco de
   * 128 amostras, para processar silêncio. É o vazamento que a instrução
   * "evite manter processamento de áudio para players que não estão sendo
   * ouvidos" nomeia, e ele não aparece como erro: aparece como o jogo ficando
   * lento depois de uma hora numa cidade movimentada.
   */
  function removeRelayPeer(actorId) {
    const chain = state.relayPeers.get(actorId);
    if (!chain) return;
    try { chain.gainNode.disconnect(); } catch { /* contexto já fechado */ }
    if (chain.filter) {
      try { chain.filter.disconnect(); } catch { /* idem */ }
      state.audioStats.filters--;
    }
    try { chain.panner.disconnect(); } catch { /* idem */ }
    state.audioStats.panners--;
    state.audioStats.chains--;
    state.relayPeers.delete(actorId);
  }

  /**
   * Custo do áudio no cliente, para a bancada.
   *
   * Exposto em `window` porque o console da CEF (localhost:9000) é o único
   * lugar de onde alguém consegue ler isto durante um teste em jogo. Os números
   * de CPU e FPS **não estão aqui** e não dá para inventá-los: eles saem do
   * profiler do DevTools e do contador do jogo, e o §11 do documento da etapa
   * diz onde olhar.
   */
  window.voiceStats = function voiceStats() {
    let sources = 0;
    for (const chain of state.relayPeers.values()) sources += chain.activeSources;
    const snapshot = {
      contexto: state.audioCtx ? state.audioCtx.state : 'inexistente',
      sampleRate: state.audioCtx ? state.audioCtx.sampleRate : null,
      // `baseLatency`/`outputLatency` existem na 108 e dizem quanto o próprio
      // navegador acrescenta — é o pedaço da latência total que não é rede.
      baseLatency: state.audioCtx ? (state.audioCtx.baseLatency ?? null) : null,
      outputLatency: state.audioCtx ? (state.audioCtx.outputLatency ?? null) : null,
      cadeias: state.audioStats.chains,
      cadeiasPico: state.audioStats.peakChains,
      panners: state.audioStats.panners,
      filtros: state.audioStats.filters,
      fontesTocando: sources,
      quadrosTocados: state.audioStats.framesPlayed,
      quadrosDescartados: state.audioStats.framesDropped,
      peersWebRTC: state.peers.size,
      // `performance.memory` é não-padrão e só existe em Chromium. Está aqui
      // com guarda porque é a ÚNICA leitura de memória que a CEF dá de graça.
      memoriaMB: (window.performance && performance.memory)
        ? Math.round(performance.memory.usedJSHeapSize / 1048576)
        : null
    };
    console.table ? console.table(snapshot) : console.log(snapshot);
    return snapshot;
  };

  // ── WebRTC ────────────────────────────────────────────────────────────────
  async function initMicrophone() {
    try {
      state.localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      ensureAudioContext();
      console.log('[voip] Microphone initialized.');
    } catch (err) {
      console.error('[voip] Mic error:', err);

      // O console do CEF fica em localhost:9000 — ninguém em jogo o vê. Toda
      // falha de microfone precisa chegar na tela, e o chip sozinho não cabe a
      // explicação: são 12px no topo, bons pra estado, ruins pra motivo. Por
      // isso o chip carrega o estado e o chat-log carrega o porquê.
      state.voiceFatal = true;
      // O chip de baixo é sobre a SUA voz, e a sua voz está com erro. O chip de
      // cima continua carregando o porquê — 12px no topo são bons para estado e
      // ruins para motivo, e é por isso que são dois e não um.
      state.voiceError = err.name || 'microfone';
      renderVoiceChip();

      if (err.name === 'NotAllowedError' || err.name === 'SecurityError') {
        // Limitação do client SkyMP oficial: o CEF embutido recusa getUserMedia.
        //
        // Até 07/08/2026 este comentário dizia que "falta um patch que nunca foi
        // mergeado upstream", como se fosse esquecimento. Não é: o release notes
        // da SkyrimPlatform 2.1 registra a *remoção deliberada* da flag do
        // Chromium que dava acesso a dispositivos de gravação pelo JavaScript do
        // navegador. Reverter globalmente exporia o microfone do jogador a
        // qualquer servidor SkyMP que ele conectasse depois — o client abre a URL
        // que o servidor mandar. Ver docs/technical/VOICE_CLIENT_PATCH.md
        // (caminho descartado) e VOICE_NATIVE_HELPER.md (o caminho atual).
        //
        // Não adianta reconectar: capturar por aqui não vai voltar a funcionar.
        setStatus('error', 'VOZ INDISPONÍVEL NESTE CLIENT — use o Discord');
        showInteractionToast(
          'Voz no jogo indisponível: este client do SkyMP não libera o microfone. ' +
          'É uma limitação conhecida do client — não é problema do seu microfone nem do servidor, ' +
          'e tentar /voz de novo dá no mesmo. Use um canal de voz do Discord: peça /voz-criar à staff.'
        );
      } else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
        setStatus('error', 'NENHUM MICROFONE ENCONTRADO');
        showInteractionToast(
          'Nenhum microfone encontrado pelo client. Confira o dispositivo no Windows e rode /voz de novo. ' +
          'Se preferir não depender disso, o canal de voz do Discord funciona agora (/voz-criar com a staff).'
        );
      } else {
        setStatus('error', 'SEM MICROFONE');
        showInteractionToast(
          `Não foi possível abrir o microfone (${err.name || 'erro desconhecido'}). ` +
          'A voz no jogo fica desligada nesta sessão — o canal de voz do Discord segue disponível (/voz-criar com a staff).'
        );
      }

      // A conexão FICA ABERTA, e isso é uma mudança deliberada.
      //
      // Antes ela era fechada aqui, com o argumento de que "sem microfone não há
      // como publicar nem faz sentido manter a sinalização aberta". O argumento
      // era correto enquanto o único tráfego deste socket fosse sinalização
      // WebRTC: sem captura não há o que sinalizar.
      //
      // Deixou de ser correto neste PR. O mesmo socket agora entrega `audio_frame`
      // — áudio de outras pessoas, capturado pelo helper nativo delas e
      // retransmitido pelo servidor. Fechar aqui desligaria a *escuta* junto com
      // a captura, e no client oficial a captura falha sempre: seria garantir que
      // ninguém nunca ouve nada, exatamente no caso que este caminho existe pra
      // resolver.
      //
      // O que não mudou: `voiceFatal` continua marcado e a mensagem específica
      // continua na tela. Quem não tem o helper continua sem falar, e continua
      // sendo mandado pro Discord — só não fica mais surdo de graça.
    }
  }

  async function initiateCall(targetActorId) {
    const pc = createPeerConnection(targetActorId);
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    sendSignal({ type: 'offer', targetActorId, sdp: offer.sdp });
  }

  async function handleOffer(fromActorId, sdp) {
    const pc = createPeerConnection(fromActorId);
    await pc.setRemoteDescription({ type: 'offer', sdp });
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    sendSignal({ type: 'answer', targetActorId: fromActorId, sdp: answer.sdp });
  }

  function createPeerConnection(remoteActorId) {
    const pc = new RTCPeerConnection({
      iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
    });

    // Adiciona o microfone local
    if (state.localStream) {
      state.localStream.getTracks().forEach(track => pc.addTrack(track, state.localStream));
    }

    pc.onicecandidate = (e) => {
      if (e.candidate) {
        sendSignal({ type: 'ice', targetActorId: remoteActorId, candidate: e.candidate });
      }
    };

    // Recebe o audio remoto
    pc.ontrack = (e) => {
      if (!state.audioCtx) return;
      const gainNode = state.audioCtx.createGain();
      gainNode.gain.value = 0; // Começa silencioso — proximity_update vai ajustar
      const source = state.audioCtx.createMediaStreamSource(new MediaStream([e.track]));
      source.connect(gainNode);
      gainNode.connect(state.audioCtx.destination);

      if (state.peers.has(remoteActorId)) {
        state.peers.get(remoteActorId).gainNode = gainNode;
      }
    };

    pc.onconnectionstatechange = () => {
      if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
        removePeer(remoteActorId);
      }
    };

    state.peers.set(remoteActorId, { pc, gainNode: null });
    return pc;
  }

  function removePeer(actorId) {
    const peer = state.peers.get(actorId);
    if (peer) {
      peer.pc.close();
      state.peers.delete(actorId);
    }
    removeRelayPeer(actorId);
  }

  function sendSignal(msg) {
    if (state.ws && state.ws.readyState === WebSocket.OPEN) {
      state.ws.send(JSON.stringify({ ...msg, fromActorId: state.actorId }));
    }
  }

  // ── HUD ──────────────────────────────────────────────────────────────────
  //
  // Seis estados, e só seis. A ordem abaixo é a de PRECEDÊNCIA, e ela importa:
  // quem está mutado E em modo sussurro precisa ler MUDO, porque é o mudo que
  // explica por que ninguém responde. Um chip que mostrasse WHISPER nessa
  // situação estaria dizendo a verdade e escondendo o problema.
  //
  //   VOICE ERROR  >  MUDO  >  MIC  >  SUSSURRO / NORMAL / GRITO
  //
  // `MIC` não é um sétimo estado: é o modo em curso com a voz saindo de fato,
  // e por isso ele APARECE JUNTO do modo em vez de substituí-lo — saber que o
  // microfone está aberto sem saber o alcance seria meia informação.
  const ROTULO_MODO = { whisper: 'SUSSURRO', normal: 'NORMAL', shout: 'GRITO' };

  function renderVoiceChip() {
    const el = document.getElementById('voip-chip');
    if (!el) return;
    const texto = document.getElementById('voip-chip-text');

    el.classList.add('visivel');
    el.classList.remove('transmitindo', 'mudo', 'erro');

    if (state.voiceError) {
      el.classList.add('erro');
      texto.textContent = 'VOZ COM ERRO';
      return;
    }
    if (state.muted) {
      el.classList.add('mudo');
      texto.textContent = 'MUDO';
      return;
    }

    const modo = ROTULO_MODO[state.voiceMode] || ROTULO_MODO.normal;
    if (state.transmitting) {
      el.classList.add('transmitindo');
      texto.textContent = `MIC · ${modo}`;
      return;
    }
    texto.textContent = modo;
  }

  function esconderVoiceChip() {
    const el = document.getElementById('voip-chip');
    if (el) el.classList.remove('visivel');
  }

  function setStatus(type, text) {
    const el = document.getElementById('voip-status');
    el.className = `visible ${type}`;
    document.getElementById('voip-status-text').textContent = text;
  }

  // ── Controles Expostos para o Gamemode ────────────────────────────────────
  function toggleMute() {
    state.muted = !state.muted;
    if (state.localStream) {
      state.localStream.getAudioTracks().forEach(t => t.enabled = !state.muted);
    }
    // Mutar derruba a transmissão AQUI também, e não só no servidor. O servidor
    // já limpa `transmitting` em `setMuted` — o que esta linha impede é o chip
    // continuar pulsando `MIC` no meio segundo até a confirmação voltar, que é
    // meio segundo de a tela dizer que a pessoa está sendo ouvida quando não
    // está. A autoridade continua sendo a de lá; esta é a cópia desenhada.
    if (state.muted) state.transmitting = false;
    sendSignal({ type: 'mute', muted: state.muted });
    mp.trigger('cef::voip:mute_changed', { muted: state.muted });
    renderVoiceChip();
  }

  function setVoiceMode(mode) {
    // O chip NÃO é atualizado aqui: o servidor pode recusar o modo, e desenhar
    // o pedido antes da resposta é como um cliente fica mostrando `shout` para
    // alguém que continua falando normal. Quem atualiza é o `case 'voice_mode'`.
    sendSignal({ type: 'voice_mode', mode });
  }

  /**
   * Desliga o áudio de voz por completo: toda cadeia desmontada, todo peer
   * fechado, chip escondido.
   *
   * Chamado quando a sinalização cai. Sem ele, a última cadeia de cada locutor
   * ficaria pendurada no `destination` até a página ser recarregada — e a
   * página de um overlay de jogo não é recarregada. É a limpeza que o teste de
   * `disconnect` exige e a que um jogador percebe como o jogo ficando pesado
   * depois de umas horas.
   */
  function tearDownVoiceAudio() {
    for (const [id] of state.relayPeers) removeRelayPeer(id);
    for (const [id] of state.peers) removePeer(id);
    state.transmitting = false;
    state.relayHeard = false;
  }

  // ── Trade Overlay ─────────────────────────────────────────────────────────
  function closeTrade() {
    document.getElementById('trade-overlay').classList.remove('open');
    mp.trigger('cef::trade:cancel', {});
  }

  // ── Interaction Menu ────────────────────────────────────────
  //
  // Desde 13/08/2026 este bloco nao decide nada. A lista de acoes, os campos de
  // cada formulario e os limites de cada campo vem inteiros do servidor, por
  // `interaction:query`; o clique volta por `interaction:execute` e e
  // revalidado do zero antes de executar.
  //
  // Antes disso o cliente acrescentava tres acoes proprias as do servidor e
  // mantinha a propria tabela de campos (`ACTION_CONFIG`). Ver
  // `docs/research/CORE_FRAMEWORK_AUDIT.md` 7 e
  // `docs/framework/INTERACTION_FRAMEWORK.md`.

  // O unico tipo de alvo com resolvedor no servidor hoje. Quando `container` ou
  // `door` ganharem um, quem abre o menu passa o tipo junto.
  const INTERACTION_TARGET_TYPE = 'player';

  /**
   * Identificador de uma tentativa, para o servidor recusar o duplo clique.
   *
   * Gerado por acao escolhida, nao por menu aberto: reenviar o MESMO id e
   * exatamente o que faz o servidor devolver o resultado anterior em vez de
   * cobrar duas vezes. So viaja em acoes que o servidor marcou
   * `requiresRequestId`.
   *
   * `crypto.randomUUID` nao existe em todo CEF; o fallback nao precisa ser
   * criptografico - precisa ser unico por jogador, e a chave de deduplicacao do
   * servidor ja e `(actorId, requestId)`.
   */
  function newRequestId() {
    if (window.crypto && typeof window.crypto.randomUUID === 'function') {
      return window.crypto.randomUUID();
    }
    return `req-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;
  }

  function findInteractionAction(actionId) {
    for (const section of state.interaction.sections) {
      for (const item of section.actions || []) {
        if (item.action === actionId) return item;
      }
    }
    return null;
  }

  function openInteractionMenu(data) {
    const d = normalizePayload(data);
    state.interaction.targetActorId = d.targetActorId || d.target || d.actorId || null;
    state.interaction.sections = [];
    state.interaction.selectedAction = null;

    document.getElementById('interaction-target').textContent =
      state.interaction.targetActorId ? `Alvo ${formatActorId(state.interaction.targetActorId)}` : 'Sem alvo';

    renderInteractionActions();
    clearInteractionDetail();
    document.getElementById('interaction-menu').classList.add('open');
    document.getElementById('interaction-menu').setAttribute('aria-hidden', 'false');

    if (state.interaction.targetActorId) {
      sendUiEvent('interaction:query', {
        targetType: INTERACTION_TARGET_TYPE,
        targetId: formatActorId(state.interaction.targetActorId)
      });
    }
  }

  function updateInteractionActions(data) {
    const d = normalizePayload(data);
    // O menu pode ter mudado de alvo enquanto a resposta vinha. Descartar e o
    // certo: mostrar as acoes de um alvo sob o nome de outro faria o jogador
    // clicar em "Prender" achando que e outra pessoa.
    const alvoDaResposta = d.target && d.target.id ? d.target.id : null;
    const alvoAtual = state.interaction.targetActorId
      ? `${INTERACTION_TARGET_TYPE}:${parseInt(String(formatActorId(state.interaction.targetActorId)).replace(/^0x/i, ''), 16)}`
      : null;
    if (alvoDaResposta && alvoAtual && alvoDaResposta !== alvoAtual) return;

    state.interaction.sections = (d.sections || []).filter(
      section => section.actions && section.actions.length > 0
    );
    renderInteractionActions();
  }

  function closeInteractionMenu() {
    document.getElementById('interaction-menu').classList.remove('open');
    document.getElementById('interaction-menu').setAttribute('aria-hidden', 'true');
    state.interaction.targetActorId = null;
    state.interaction.sections = [];
    state.interaction.selectedAction = null;
    clearInteractionDetail();
  }

  function renderInteractionActions() {
    const root = document.getElementById('interaction-actions');
    root.innerHTML = '';

    if (state.interaction.sections.length === 0) {
      const vazio = document.createElement('div');
      vazio.className = 'interaction-section-title';
      // Diferente de "carregando": o servidor respondeu e nao ha nada a fazer
      // com este alvo daqui. Silencio faria parecer que o menu quebrou.
      vazio.textContent = 'Nenhuma acao disponivel com este alvo.';
      root.appendChild(vazio);
      return;
    }

    for (const section of state.interaction.sections) {
      const sectionEl = document.createElement('section');
      sectionEl.className = 'interaction-section';

      const title = document.createElement('div');
      title.className = 'interaction-section-title';
      title.textContent = section.label || section.id;
      sectionEl.appendChild(title);

      const list = document.createElement('div');
      list.className = 'interaction-actions';

      for (const item of section.actions || []) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'interaction-action';
        button.dataset.action = item.action;
        // `textContent` em dois nos, nao `innerHTML`: o rotulo vem do servidor,
        // mas interpolar texto de fora em HTML e a mesma classe de erro
        // independente de quem manda.
        const label = document.createElement('span');
        label.textContent = item.label || item.action;
        const hint = document.createElement('span');
        hint.className = 'hint';
        hint.textContent = '›';
        button.appendChild(label);
        button.appendChild(hint);
        button.onclick = () => selectInteractionAction(item.action);
        list.appendChild(button);
      }

      sectionEl.appendChild(list);
      root.appendChild(sectionEl);
    }
  }

  function selectInteractionAction(action) {
    const item = findInteractionAction(action);
    if (!item) return;

    state.interaction.selectedAction = action;
    for (const el of document.querySelectorAll('.interaction-action')) {
      el.classList.toggle('active', el.dataset.action === action);
    }

    document.getElementById('interaction-detail-empty').style.display = 'none';
    const form = document.getElementById('interaction-action-form');
    form.classList.add('active');
    document.getElementById('detail-title').textContent = item.label || action;
    document.getElementById('detail-description').textContent =
      (item.fields && item.fields.length > 0)
        ? 'Preencha os campos e confirme. O servidor valida tudo de novo antes de executar.'
        : 'Confirme para executar. O servidor valida tudo de novo antes de executar.';

    const fields = document.getElementById('detail-fields');
    fields.innerHTML = '';
    for (const field of item.fields || []) {
      fields.appendChild(createActionField(field));
    }
  }

  /**
   * Monta um input a partir do `schema` que o servidor declarou.
   *
   * O mapeamento de tipo e so apresentacao - `int` vira `number` porque o
   * teclado numerico e melhor, `string` longa vira `textarea` porque cabe mais.
   * **Nada aqui valida**: `min`, `max` e `required` sao conforto de digitacao, e
   * o servidor os checa de novo contra o mesmo schema que os gerou. Um cliente
   * modificado que os remova nao ganha nada.
   */
  function createActionField(field) {
    const row = document.createElement('div');
    row.className = 'form-row';

    const label = document.createElement('label');
    label.htmlFor = `field-${field.name}`;
    label.textContent = field.label || field.name;
    row.appendChild(label);

    let input;
    if (field.type === 'enum') {
      input = document.createElement('select');
      for (const value of field.values || []) {
        const opt = document.createElement('option');
        opt.value = value;
        opt.textContent = value;
        input.appendChild(opt);
      }
    } else if (field.type === 'bool') {
      input = document.createElement('select');
      for (const value of ['true', 'false']) {
        const opt = document.createElement('option');
        opt.value = value;
        opt.textContent = value === 'true' ? 'Sim' : 'Nao';
        input.appendChild(opt);
      }
    } else if (field.type === 'string' && (field.max === undefined || field.max > 60)) {
      input = document.createElement('textarea');
    } else {
      input = document.createElement('input');
      input.type = field.type === 'int' ? 'number' : 'text';
    }

    input.id = `field-${field.name}`;
    input.name = field.name;
    if (field.placeholder) input.placeholder = field.placeholder;
    if (field.min !== undefined) input.min = field.min;
    if (field.max !== undefined && field.type === 'int') input.max = field.max;
    if (field.max !== undefined && field.type === 'string') input.maxLength = field.max;
    if (field.required) input.required = true;
    row.appendChild(input);
    return row;
  }

  function clearInteractionDetail() {
    state.interaction.selectedAction = null;
    document.getElementById('interaction-detail-empty').style.display = 'flex';
    document.getElementById('interaction-action-form').classList.remove('active');
    document.getElementById('detail-fields').innerHTML = '';
    for (const el of document.querySelectorAll('.interaction-action')) {
      el.classList.remove('active');
    }
  }

  function submitInteractionAction(event) {
    event.preventDefault();
    const action = state.interaction.selectedAction;
    if (!action || !state.interaction.targetActorId) {
      showInteractionToast('Selecione uma acao valida.');
      return;
    }

    const item = findInteractionAction(action);
    if (!item) {
      showInteractionToast('Acao indisponivel. Abra o menu de novo.');
      return;
    }

    const data = {};
    const formData = new FormData(event.currentTarget);
    for (const [key, value] of formData.entries()) {
      data[key] = value;
    }

    const payload = {
      action,
      targetId: formatActorId(state.interaction.targetActorId),
      data
    };
    if (item.requiresRequestId) payload.requestId = newRequestId();

    sendUiEvent('interaction:execute', payload);

    // Sem "Acao enviada": o servidor responde por notificacao - com o resultado
    // ou com o motivo da recusa. Um toast otimista aqui diria "enviada" a quem
    // acabou de ser recusado por distancia, e o jogador acreditaria no cliente.
    closeInteractionMenu();
  }

  window.openInteractionMenu = openInteractionMenu;
  window.updateInteractionActions = updateInteractionActions;
  window.closeInteractionMenu = closeInteractionMenu;
  window.handleServerModal = (payload) => {
    const message = normalizePayload(payload);
    if (message.type === 'interaction:actions') {
      updateInteractionActions(message.data);
    }
    if (message.type === 'interaction:open') {
      openInteractionMenu(message.data);
    }
    if (message.type === 'governance:toast' || message.type === 'toast') {
      showInteractionToast(message.data && message.data.message ? message.data.message : 'Atualizado.');
    }
  };

  // Disparado pela property SkyMP 'voipTicket' quando o jogador roda /voz.
  // (Substitui um listener mp.events.add('voip:connect', ...) que nunca
  // funcionou de verdade — nada no servidor jamais dava mp.trigger nele.)
  window.handleVoipTicket = (payload) => {
    const msg = normalizePayload(payload);
    if (!msg || !msg.actorId || !msg.ticket) return;
    connectVoip(msg.actorId, msg.ticket, msg.host, msg.port);
  };

  // Nametag (POC). Chamada pelo snippet de cliente do nametag-service, até
  // 20x/s enquanto houver alguém em alcance — ver nametag-service.js §2.
  //
  // Esta função NÃO decide nada: `nome` chega pronto do servidor, resolvido por
  // `identity.getDisplayName(observador, alvo)`. É a mesma regra do resto do
  // projeto ("o servidor decide, o cliente exibe"), e aqui ela é a feature
  // inteira — se o cliente pudesse escolher o texto, o anonimato não existiria.
  //
  // Escreve direto no elemento em vez de passar por `normalizePayload`+DOM
  // novo: este é o único caminho da UI que roda em frequência, e recriar nó a
  // 20 Hz é o custo que o HUD de voz já aprendeu a evitar.
  window.handleNametag = (payload) => {
    const el = document.getElementById('nametag');
    if (!el) return;
    const msg = normalizePayload(payload);

    if (!msg || !msg.visivel) {
      el.classList.remove('visivel');
      return;
    }

    if (el.textContent !== msg.nome) el.textContent = msg.nome || '';
    el.style.left = msg.x + '%';
    el.style.top = msg.y + '%';
    el.classList.add('visivel');
  };

  // ── Eventos vindos do backend Node.js ────────────────────────────────────
  if (mp && mp.events) {
    mp.events.add('showTradeUI', () => {
      document.getElementById('trade-overlay').classList.add('open');
    });

    mp.events.add('hideTradeUI', () => {
      document.getElementById('trade-overlay').classList.remove('open');
    });

    mp.events.add('voip:mute', () => toggleMute());
    mp.events.add('voip:setMode', (data) => {
      const d = typeof data === 'string' ? JSON.parse(data) : data;
      setVoiceMode(d.mode);
    });

    mp.events.add('interaction:open', (data) => openInteractionMenu(data));
    mp.events.add('interaction:close', () => closeInteractionMenu());
    // `governance:interaction:actions` e `:open` saíram em 13/08/2026 junto com
    // o caminho legado do servidor. O menu agora fala `interaction:*` nos dois
    // sentidos.
  }

  window.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && document.getElementById('interaction-menu').classList.contains('open')) {
      closeInteractionMenu();
    }
  });
</script>
<script src="player-panel.js"></script>
</body>
</html>
